name: CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run local eval harness
        run: node eval/harness/run.mjs

      - name: Build skillpacks
        run: node shared/scripts/skillpack-build.mjs --clean --out=dist --targets=codex,vscode,claude

      - name: Install skillpacks (smoke)
        run: |
          skillpack_test_dir="$(mktemp -d)"
          node shared/scripts/skillpack-install.mjs --from=dist --dest="$skillpack_test_dir" --targets=codex,vscode,claude
          test -f "$skillpack_test_dir/.codex/skills/woo-extension-dev/SKILL.md"
          test -f "$skillpack_test_dir/.github/skills/woo-block-theme-dev/SKILL.md"
          test -f "$skillpack_test_dir/.claude/skills/woo-mcp-connect/SKILL.md"
          test ! -e "$skillpack_test_dir/.codex/skills/woo-cart-checkout"
